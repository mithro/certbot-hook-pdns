[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "certbot-hook-pdns"
version = "0.1.0"
description = "Certbot DNS-01 hook for a PowerDNS bind-backend hidden primary"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.scripts]
certbot-hook-pdns = "certbot_hook_pdns.cli:main"

[tool.setuptools.packages.find]
include = ["certbot_hook_pdns*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
